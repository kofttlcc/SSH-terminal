<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ITGeek Terminal</title>
    <link rel="stylesheet" href="xterm.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #090a0f;
            user-select: none;
            -webkit-user-select: none;
        }
        #terminal-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            padding: 2px 4px;
            overflow: hidden;
        }
        .xterm {
            width: 100% !important;
            height: 100% !important;
            font-feature-settings: "liga" 0;
            position: relative;
            user-select: text;
            -webkit-user-select: text;
        }
        .xterm .xterm-screen {
            width: 100% !important;
        }
        .xterm .xterm-viewport {
            background-color: #090a0f !important;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>
    <div id="terminal-container"></div>

    <script src="xterm.js"></script>
    <script src="addon-fit.js"></script>
    <script src="addon-unicode11.js"></script>
    <script>
        (function() {
            window.onerror = function(msg, url, line) {
                console.error("Global JS Error:", msg, url, line);
            };

            const container = document.getElementById('terminal-container');
            
            const term = new Terminal({
                cursorBlink: true,
                cursorStyle: 'block',
                cursorWidth: 2,
                fontSize: 13,
                fontFamily: 'Menlo, Monaco, "Courier New", monospace, "PingFang SC", "Microsoft YaHei"',
                lineHeight: 1.2,
                letterSpacing: 0,
                scrollback: 10000,
                allowTransparency: true,
                macOptionIsMeta: true,
                macOptionClickForcesSelection: true,
                theme: {
                    background: '#090a0f',
                    foreground: '#e2e8f0',
                    cursor: '#38bdf8',
                    cursorAccent: '#090a0f',
                    selectionBackground: 'rgba(56, 189, 248, 0.3)',
                    selectionForeground: '#ffffff',
                    black: '#0f172a',
                    red: '#ef4444',
                    green: '#22c55e',
                    yellow: '#eab308',
                    blue: '#3b82f6',
                    magenta: '#a855f7',
                    cyan: '#06b6d4',
                    white: '#e2e8f0',
                    brightBlack: '#64748b',
                    brightRed: '#f87171',
                    brightGreen: '#4ade80',
                    brightYellow: '#facc15',
                    brightBlue: '#60a5fa',
                    brightMagenta: '#d8b4fe',
                    brightCyan: '#67e8f9',
                    brightWhite: '#ffffff'
                }
            });

            // Safe Addon Loading
            let fitAddon = null;
            try {
                if (typeof FitAddon !== 'undefined') {
                    if (typeof FitAddon === 'function') {
                        fitAddon = new FitAddon();
                    } else if (typeof FitAddon.FitAddon === 'function') {
                        fitAddon = new FitAddon.FitAddon();
                    }
                } else if (typeof window.FitAddon !== 'undefined') {
                    if (typeof window.FitAddon.FitAddon === 'function') {
                        fitAddon = new window.FitAddon.FitAddon();
                    } else if (typeof window.FitAddon === 'function') {
                        fitAddon = new window.FitAddon();
                    }
                }
                if (fitAddon) {
                    term.loadAddon(fitAddon);
                }
            } catch (e) {
                console.warn("FitAddon error:", e);
            }

            try {
                if (typeof Unicode11Addon !== 'undefined') {
                    let u11 = null;
                    if (typeof Unicode11Addon === 'function') {
                        u11 = new Unicode11Addon();
                    } else if (typeof Unicode11Addon.Unicode11Addon === 'function') {
                        u11 = new Unicode11Addon.Unicode11Addon();
                    }
                    if (u11) {
                        term.loadAddon(u11);
                        term.unicode.activeVersion = '11';
                    }
                }
            } catch (e) {
                console.warn("Unicode11Addon error:", e);
            }

            term.open(container);

            function doFit() {
                if (!fitAddon || !term) return;
                try {
                    if (container && container.clientWidth > 10 && container.clientHeight > 10) {
                        fitAddon.fit();
                    }
                } catch (e) {
                    console.warn("doFit error:", e);
                }
            }

            // Keystrokes -> Swift
            term.onData(function(data) {
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.terminalData) {
                    window.webkit.messageHandlers.terminalData.postMessage(data);
                }
            });

            // Resize -> Swift
            term.onResize(function(size) {
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.terminalResize) {
                    window.webkit.messageHandlers.terminalResize.postMessage({
                        cols: size.cols,
                        rows: size.rows
                    });
                }
            });

            // Responsive Layout Observers
            if (window.ResizeObserver) {
                const resizeObserver = new ResizeObserver(function() {
                    requestAnimationFrame(doFit);
                });
                resizeObserver.observe(container);
                resizeObserver.observe(document.body);
            }

            window.addEventListener('resize', function() {
                requestAnimationFrame(doFit);
            });

            // Lifecycle progressive auto-fits (ensures font metrics and canvas are measured)
            requestAnimationFrame(doFit);
            setTimeout(doFit, 50);
            setTimeout(doFit, 150);
            setTimeout(doFit, 300);
            setTimeout(doFit, 600);
            setTimeout(doFit, 1200);

            // Swift APIs
            window.writeTerminalData = function(base64) {
                try {
                    const binary = atob(base64);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) {
                        bytes[i] = binary.charCodeAt(i);
                    }
                    term.write(bytes);
                } catch (e) {
                    console.error("writeTerminalData error:", e);
                }
            };

            window.writeRawString = function(text) {
                term.write(text);
            };

            window.fitTerminal = function() {
                requestAnimationFrame(doFit);
            };

            window.focusTerminal = function() {
                term.focus();
            };

            window.clearTerminal = function() {
                term.clear();
            };

            // Ready notification to Swift
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.terminalReady) {
                window.webkit.messageHandlers.terminalReady.postMessage(true);
            }
        })();
    </script>
</body>
</html>
